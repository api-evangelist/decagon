aid: decagon
name: Decagon
description: Decagon is an enterprise AI customer service platform that builds and operates voice, chat,
  and email AI agents on top of natural-language Agent Operating Procedures (AOPs). The platform includes
  the AI Agents Studio for authoring agents, Watchtower for continuous quality assurance, Voice of the Customer
  analytics, A/B testing and simulations, and tool connectors for back-office integrations. Decagon is enterprise
  sales-led; its developer documentation is gated behind an access code and no self-serve public API is published.
